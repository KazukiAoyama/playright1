name: Scrape Saitama Park Reservation

on:
  schedule:
    # JST 06:00 - 22:30, every 30 minutes
    # UTC 21:00 - 23:30 (previous day) and UTC 00:00 - 13:30 (current day)
    - cron: '0,30 21-23,0-13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Check Schedule
        id: check_schedule
        run: |
          python scraper/check_schedule.py

      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch' || steps.check_schedule.outputs.should_run == 'true'
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Scraper
        if: github.event_name == 'workflow_dispatch' || steps.check_schedule.outputs.should_run == 'true'
        run: |
          python scraper/scrape.py

      - name: Commit and Push updated data
        if: github.event_name == 'workflow_dispatch' || steps.check_schedule.outputs.should_run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: update availability data (pref & city)'
          file_pattern: 'docs/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
