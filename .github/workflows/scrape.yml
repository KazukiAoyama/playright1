name: Scrape Saitama Park Reservation

on:
  # Cloudflare Workers の Cron Triggers から定時実行されるため内蔵scheduleは無効化（二重実行防止）
  # schedule:
  #   # JST 06:08 - 08:38, every 30 minutes (UTC 21:08 - 23:38 previous day)
  #   - cron: '8,38 21-23 * * *'
  #   # JST 09:08 - 22:38, every 30 minutes (UTC 00:08 - 13:38 current day)
  #   - cron: '8,38 0-13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution (skip schedule check)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Tokyo'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Check Schedule
        id: check_schedule
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced run requested via inputs.force"
            python scraper/check_schedule.py --force
          else
            python scraper/check_schedule.py
          fi


      - name: Install Playwright Chromium
        if: github.event_name == 'workflow_dispatch' || steps.check_schedule.outputs.should_run == 'true'
        run: |
          python -m playwright install chromium --with-deps

      - name: Run Scraper (Saitama City)
        if: github.event_name == 'workflow_dispatch' || steps.check_schedule.outputs.should_run == 'true'
        run: |
          python scraper/scrape.py city

      - name: Commit and Push updated data
        if: (github.event_name == 'workflow_dispatch' || steps.check_schedule.outputs.should_run == 'true') && always() && steps.check_schedule.conclusion == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto: update availability data (city)'
          file_pattern: 'docs/data_city.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
